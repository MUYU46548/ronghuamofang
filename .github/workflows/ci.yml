name: CI

# 目的：每次 push / PR 自动跑一遍质量门 + 全量测试，**永久防回归**。
# 代码改完忘了跑测试，是这类项目最容易积累的静默债务。
#
# 刻意**不跑 e2e**（tests/e2e/）：它需要 playwright 浏览器 + 4 个空闲端口
# + 秒级等待窗口，在共享 CI runner 上天然不稳。假红比没有 CI 更糟 ——
# 一旦"红灯是正常的"成为共识，真红也没人看。
# 发版前的完整闸门仍在本地跑：python scripts/nfctl.py release-check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # requirements-dev.txt 一并装上（含 pyflakes）。
      # 不装 = 闸门静默跳过 ≠ 通过 —— 这条教训在 requirements-dev.txt 里也写着。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: 质量门（pyflakes：未定义名必须为 0）
        run: python scripts/quality_gate.py

      # 自定义运行器：exit 0 = 全部 PASS（非 pytest）
      - name: 全量测试（tests/unit + tests/http）
        run: python scripts/nfctl.py test
