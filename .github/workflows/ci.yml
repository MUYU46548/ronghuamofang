name: CI

# 目的：每次 push / PR 自动跑一遍质量门 + 全量测试，**永久防回归**。
# 代码改完忘了跑测试，是这类项目最容易积累的静默债务。
#
# 刻意**不跑 e2e**（tests/e2e/）：它需要 playwright 浏览器 + 4 个空闲端口
# + 秒级等待窗口，在共享 CI runner 上天然不稳。假红比没有 CI 更糟 ——
# 一旦"红灯是正常的"成为共识，真红也没人看。
# 发版前的完整闸门仍在本地跑：python scripts/nfctl.py release-check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows 中心测试（.bat 桩 / taskkill / .venv\Scripts 路径 / 本机录制指纹）
    # 在 ubuntu 上必红（10-09 实证 30/30 红的第二层根因），换回原生环境。
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 对齐本地开发环境 .venv 3.11（原 3.13 与开发/录制环境差两个小版本，
          # 版本敏感断言会制造与平台无关的假红）
          python-version: "3.11"
          cache: pip

      # 依赖装进**项目 .venv** —— 源码态约定：interp_guard 与测试套（B1/D2/E3 等）
      # 都假定仓库里有 .venv；装进 setup-python 解释器会让守卫判「缺 PyYAML 且
      # 项目没有 .venv」直接拦下（10-10 首轮 Windows CI 红的根因之一）。
      # 装进 setup-python 的老步骤已删（.venv 才是这些断言的对象）。
      - name: 建项目 .venv 并装依赖
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      # 质量门（pyflakes：未定义名必须为 0）
      - name: 质量门（pyflakes：未定义名必须为 0）
        run: .\.venv\Scripts\python.exe scripts\quality_gate.py

      # 自定义运行器：exit 0 = 全部 PASS（非 pytest）
      - name: 全量测试（tests/unit + tests/http）
        run: .\.venv\Scripts\python.exe scripts\nfctl.py test

  # ==========================================================================
  # 泄露门禁：挡住「私人词 → 发布树」。
  #
  # fail-closed 是刻意的：secret 缺失 / 为空 / 条目数不足 → 任务直接红。
  # 一个悄悄退化成空名单的门禁等于没有门禁，而"扫了但没报"比没扫更危险。
  #
  # 真词表只存在两处：本机 ci/blacklist.txt（.gitignore 忽略）与 CI secret
  # `LEAK_BLACKLIST`（换行分隔）。仓库里只有零真值的 ci/blacklist.example。
  #
  # ⚠️ 只在 push / 手动触发 / **同仓** PR 上跑：fork PR 拿不到 secret，若一并强制
  #    fail-closed，所有外部 PR 会永久红 —— 假红会训练人忽略红灯。外部 PR 合并前
  #    维护者自己 push 一次即可被本任务覆盖。
  # ==========================================================================
  leak-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 泄露门禁（fail-closed）
        env:
          LEAK_BLACKLIST: ${{ secrets.LEAK_BLACKLIST }}
        run: |
          if [ -z "${LEAK_BLACKLIST:-}" ]; then
            echo "::error::机密 LEAK_BLACKLIST 未配置 —— fail-closed，不放行（格式见 ci/blacklist.example）"
            exit 1
          fi
          printf '%s\n' "$LEAK_BLACKLIST" > /tmp/blacklist.txt
          echo "词表有效行数：$(grep -cvE '^[[:space:]]*(#|$)' /tmp/blacklist.txt || true)"
          python scripts/leak_scan.py --list /tmp/blacklist.txt --max-print 80

      # 通用规则（换个用户也成立）随发布树走，不依赖任何 secret。
      #
      # 只判**绝不该被跟踪**的路径。以下两类是**已知、已登记**的存量债，刻意不在这里
      # 拦（拦了 CI 立刻常红，常红等于没红灯），改由发布日 checklist 处理：
      #   · materials/vault_links.md            （含私路径/作品词，发布日 git rm --cached）
      #   · deliverables/**                     （内部报告，发布日 git rm --cached）
      # 这两项一旦执行，本步骤可收紧为全量。
      - name: 通用规则（运行产物不得进发布树）
        run: |
          BAD=$(git ls-files | grep -E '^(logs|data|output|history)/|^materials/original_scraps/|^materials/raw/.+\.md$' \
                | grep -vE '^materials/raw/README\.md$|^tests/e2e/fixture_project/' || true)
          if [ -n "$BAD" ]; then
            echo "::error::发布树里跟踪了运行产物："
            echo "$BAD"
            exit 1
          fi
          echo "OK：无运行产物被跟踪"

