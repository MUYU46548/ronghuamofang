# =========================================================
# NovelForge 全局配置（不含密钥，可提交 Git）
# 参考：架构文档 v2 第七章；P2 引擎无关化（2026-09-09）
# =========================================================

# 执行引擎：hermes | direct（OpenAI 兼容直连，推荐——Hermes 仅为过渡执行引擎）
engine: direct

# 服务商登记（type 仅支持 openai-compat；密钥走 .env，绝不写进本文件）
providers:
  hunyuan:
    type: openai-compat
    base_url: https://api.hunyuan.cloud.tencent.com/v1
    api_key_env: HUNYUAN_API_KEY
    timeout: 600
    retries: 3
    # 说明：默认并发 5 路；免费包（开通赠 100 万 tokens/1 年有效）耗尽后
    # 默认不自动转后付费（欠费前会报错，安全）。文档：混元生文计费概述。

model:
  # 角色路由：writer=阶段4/6（写作），checker=阶段5（检查），default=其余
  # 模型 ID 与单价必须真实（cost_tracker.RATES；未录入模型按保守默认价告警）
  default:
    provider: hunyuan
    id: hunyuan-lite          # 免费模型：设定归并/大纲/精修/后处理等
  writer:
    provider: hunyuan
    id: hunyuan-a13b          # 写作主力（刊例 in 0.5 / out 2 元每百万，免费包 100 万 tokens 优先扣）
  checker:
    provider: hunyuan
    id: hunyuan-lite          # 检查也可用 a13b，先免费模型跑通再按质量升级

budget:
  limit_yuan: 300             # 超限自动暂停（也可由 .env 的 BUDGET_LIMIT_YUAN 覆盖）
  warn_ratio: 0.7             # 消耗 70% 时提醒

parallelism:
  writing: 1                  # 阶段4串行（一致性优先）
  polish: 3                   # 阶段6分卷并行（注意混元默认并发限 5 路）
  checks_max_concurrent: 2    # 阶段5每批并行路数

chapter:
  target_words: [2000, 3000]  # 单章目标字数区间
  summary_every: 5            # 滚动摘要近期区容量（章）
  batch_outline: 10           # 阶段3每批章数
  quality_threshold: 6        # 自评分下限（P1 启用自动重写）
  page_break: true            # 阶段7 每章新起一页（模板/无模板均生效）

gates:
  require_approval: [2, 6]    # 阶段2（整体大纲）+ 阶段6（润色稿）完成后等人工确认；全自动填 []
  pause_on_failure: true      # 阶段级失败时暂停等人工
  setting_refine_reminder: true  # P1.5：stage2 审批前 THIN 碎片角色提醒

logging:
  level: info
  rotate_days: 30
