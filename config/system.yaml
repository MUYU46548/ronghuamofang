engine: direct
providers:
  tokenhub:
    type: openai-compat
    base_url: https://tokenhub.tencentmaas.com/v1
    api_key_env: TOKENHUB_API_KEY
    timeout: 600
    retries: 5
    available_models:
    - qwen3.5-flash
    - minimax-m2.7
    - glm-5.1
    - glm-5-turbo
    - glm-5
    - glm-5.3
    - glm-5.3-flash
    - deepseek-v4-flash
    - deepseek-v4-pro
    - kimi-k2.6
    - kimi-k3
    fallback:
    # ⚠️ fallback 链里不得放**已下线/即将下线**的模型：`_post_chat` 对 400/401/403/404
    # 直接 raise，死模型一跳就会吃掉链上后续所有兜底（2026-10-09 glm-5 下线 → 已摘除）。
    - kimi-k2.6
    - minimax-m2.7
    - glm-5-turbo
    disable_thinking_models:
    - minimax-m2.7   # 2026-09-23 实测：默认进思考（reasoning 388 字 / 正文 54 字，输出 token 翻 3 倍）
                     # 注入 payload[0] `thinking:{type:disabled}` 有效（总输出 129→58）；
                     # ⚠️ 但 payload[1] `reasoning_effort:none` 对本模型**有害**（reasoning 1107、
                     # 正文为空、撞满 max_tokens）→ 候选顺序不能把它提到前面
    - glm-5.1
    - glm-5
    - glm-5-turbo
    - glm-5.3
    - glm-5.3-flash
    - kimi-k2.5
    - kimi-k2.6
    - kimi-k3
    - qwen3.5-flash
    disable_thinking_payloads:
    - thinking:
        type: disabled
    - reasoning_effort: none
    - enable_thinking: false
  # 美团 LongCat（龙猫）—— 2026-10-01 预置。OpenAI 兼容协议，与上面同一套客户端，
  # 代码零改动（换供应商只改本文件）。
  # ⚠️ 拿到 Key 后**必须实测**两处（官方文档自相矛盾）：
  #   ① base_url：文档给的端点是 .../openai/v1/chat/completions，SDK 示例却写
  #      base_url=.../openai。本项目的客户端按 `base_url + "/chat/completions"` 拼接，
  #      故先填带 /v1 的完整形态；**若报 404 就删掉结尾的 /v1**。
  #   ② /models 拉取：GUI「↻ 同步服务商模型」会请求 `base_url + "/models"`，
  #      龙猫若不支持该端点会返回错误 —— 属**可忽略**（另两处入口不受影响）。
  # 自检：python scripts/nfctl.py model-check longcat
  longcat:
    type: openai-compat
    base_url: https://api.longcat.chat/openai/v1
    api_key_env: LONGCAT_API_KEY
    timeout: 600
    retries: 5
    available_models:
    - LongCat-2.0            # 1M 上下文 / 最大输出 128K（官方规格）
    - LongCat-2.5-Preview
    fallback: []             # ⚠️ 刻意留空：跨供应商的模型名不能放进同一个 base_url 下
                             # （本项目 fallback 链复用当前 provider 的端点与 Key，
                             #   放 tokenhub 的模型名进来 → 404 → 直接 raise，吃掉整条链）
    # disable_thinking_models 暂不预设：LongCat-2.x 是否默认进思考模式**未实测**。
    # 若实测正文为空/进 reasoning_content，把模型名加进来即可（无需改代码）。
model:
  default:
    provider: tokenhub
    id: kimi-k2.6
  architect:
    provider: tokenhub
    id: kimi-k2.6
  outliner:
    provider: tokenhub
    id: kimi-k2.6
  writer:
    provider: tokenhub
    id: kimi-k2.6
  checker:
    provider: tokenhub
    id: kimi-k2.6
  reviewer:
    provider: tokenhub
    id: kimi-k2.6
  polisher:
    provider: tokenhub
    id: kimi-k2.6
budget:
  limit_yuan: 300
  warn_ratio: 0.7
  # 熔断恢复：manual = 用户通过 GUI 手动恢复（默认）
  circuit_breaker:
    mode: "manual"
    require_confirmation: true
    show_restart_from: true
parallelism:
  writing: 1
  polish: 3
  checks_max_concurrent: 2
chapter:
  target_words:
  - 2000
  - 5500
  summary_every: 15
  summary_window: 15
  batch_outline: 10
  quality_threshold: 6
  page_break: true
gates:
  agent_mode: true                 # 外部 Agent 模式：开启后 HTTP API 开放给外部 Agent 调用，
                                   # 但禁止性操作（审批/打回/归档/恢复/项目创建）仍只允许 GUI 内手动执行
  require_approval:
  - 2
  - 6
  pause_on_failure: true
  setting_refine_reminder: true
  setting_refine_auto: false     # stage1 后自动跑 setting_refine --auto-thin 闭环（默认关）
  setting_refine_max_rounds: 1   # 闭环轮次上限（1=只跑一轮；建议不超过 2）
  review_after_stage4: true
  review_after_stage5: false
  proofread_after_polish: false  # stage 5.5：润色后校对（默认关）
  proofread_llm: false           # 校对是否启用 LLM 语义校对（默认关）
  auto_refine: false
  auto_rewrite: false
  auto_rewrite_max_rounds: 1
  # 长跑保护（2026-10-01）：stage4 逐章写作中**连续 N 章失败**即判定为系统性故障
  # （模型不可用 / 提示词被改坏 / 输入构造出错）并**提前停止**，避免"坏掉了还一路
  # 跑完 100 章"在盘上留下满盘废稿。0 = 关闭本保护。
  stage4_max_consecutive_failures: 3
  auto_retry: true                # 阶段失败后自动重试（默认开）
  auto_retry_max_rounds: 2        # 最大自动重试轮次（不含首次）
  auto_retry_delay_seconds: 3      # 重试前等待（秒），给 LLM 限流/超时恢复时间
  auto_retry_backoff: 2            # 退避系数：3s → 6s → 12s …
  quality_gate: true               # 件4：全流程收尾强制跑 quality_checklist，非零退出即红阻断
                                   # （防「门禁失守还盖绿灯」：产物存在 ≠ 产物合格）。
                                   # 仅在**全流程**收尾生效；单阶段 --stage N 重跑不拦。
  stage8_export: true  # 阶段8：Markdown 分卷导出
obsidian:
  # vault path（只读）：用户自己的 Obsidian 知识库根目录
  # 留空则不启用 Obsidian 联动；首次使用请在 GUI「设置」页填写本地路径
  # （本地私有路径不应进 Git——请在本地覆盖，切勿提交自己的真实路径）
  vault_path: ""
  # Obsidian 联动沙盒目录（唯一可写位置，vault 本体只读）
  # 支持绝对路径或相对路径（相对于项目根目录）
  sandbox_dir: ""
  # 是否启用路径遍历防护（默认开）
  path_traversal_guard: true
logging:
  level: info
  rotate_days: 30
