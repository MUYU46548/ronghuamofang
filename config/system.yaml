engine: direct
providers:
  tokenhub:
    type: openai-compat
    base_url: https://tokenhub.tencentmaas.com/v1
    api_key_env: TOKENHUB_API_KEY
    timeout: 600
    retries: 3
    available_models:
    - qwen3.5-flash
    - glm-5.1
    - glm-5-turbo
    - glm-5
    - glm-5.3
    - glm-5.3-flash
    - deepseek-v4-flash
    - deepseek-v4-pro
    - kimi-k3
    fallback:
    - qwen3.5-flash
    - glm-5
    - glm-5-turbo
    disable_thinking_models:
    - glm-5.1
    - glm-5
    - glm-5-turbo
    - glm-5.3
    - glm-5.3-flash
    - kimi-k2.5
    - kimi-k3
    - qwen3.5-flash
    disable_thinking_payloads:
    - thinking:
        type: disabled
    - reasoning_effort: none
    - enable_thinking: false
model:
  default:
    provider: tokenhub
    id: qwen3.5-flash
  architect:
    provider: tokenhub
    id: qwen3.5-flash
  outliner:
    provider: tokenhub
    id: qwen3.5-flash
  writer:
    provider: tokenhub
    id: qwen3.5-flash
  checker:
    provider: tokenhub
    id: qwen3.5-flash
  reviewer:
    provider: tokenhub
    id: qwen3.5-flash
  polisher:
    provider: tokenhub
    id: qwen3.5-flash
budget:
  limit_yuan: 300
  warn_ratio: 0.7
  # 熔断恢复：manual = 用户通过 GUI 手动恢复（默认）
  circuit_breaker:
    mode: "manual"
    require_confirmation: true
    show_restart_from: true
parallelism:
  writing: 1
  polish: 3
  checks_max_concurrent: 2
chapter:
  target_words:
  - 1200
  - 3500
  summary_every: 15
  summary_window: 15
  batch_outline: 10
  quality_threshold: 6
  page_break: true
gates:
  require_approval:
  - 2
  - 6
  pause_on_failure: true
  setting_refine_reminder: true
  review_after_stage4: true
  review_after_stage5: false
  proofread_after_polish: false  # stage 5.5：润色后校对（默认关）
  proofread_llm: false           # 校对是否启用 LLM 语义校对（默认关）
  auto_refine: false
  auto_rewrite: false
  auto_rewrite_max_rounds: 1
  auto_retry: true                # 阶段失败后自动重试（默认开）
  auto_retry_max_rounds: 2        # 最大自动重试轮次（不含首次）
  auto_retry_delay_seconds: 3      # 重试前等待（秒），给 LLM 限流/超时恢复时间
  auto_retry_backoff: 2            # 退避系数：3s → 6s → 12s …
  stage8_export: true  # 阶段8：Markdown 分卷导出
obsidian:
  # vault path (read-only)
  vault_path: "E:/图书馆/ROSA"
  # Obsidian 联动沙盒目录（唯一可写位置，vault 本体只读）
  # 支持绝对路径或相对路径（相对于项目根目录）
  sandbox_dir: "E:/图书馆/ROSA/Obsidian_AI_Sandbox/10_Inbox"
  # 是否启用路径遍历防护（默认开）
  path_traversal_guard: true
logging:
  level: info
  rotate_days: 30
