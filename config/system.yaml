engine: direct
providers:
  tokenhub:
    type: openai-compat
    base_url: https://tokenhub.tencentmaas.com/v1
    api_key_env: TOKENHUB_API_KEY
    timeout: 600
    retries: 3
model:
  default:
    provider: tokenhub
    id: glm-5
  writer:
    provider: tokenhub
    id: glm-5
  checker:
    provider: tokenhub
    id: glm-5
budget:
  limit_yuan: 300
  warn_ratio: 0.7
parallelism:
  writing: 1
  polish: 3
  checks_max_concurrent: 2
chapter:
  target_words:
  - 2000
  - 3000
  summary_every: 5
  batch_outline: 10
  quality_threshold: 6
  page_break: true
gates:
  require_approval:
  - 2
  - 6
  pause_on_failure: true
  setting_refine_reminder: true
logging:
  level: info
  rotate_days: 30
