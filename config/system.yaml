engine: hermes

# Hermes 子会话（engine: hermes 时生效；此时 model.* 被忽略 —— 用 agent 内部模型）
hermes:
  timeout: 900          # 单次子会话墙钟硬超时（秒）→ 超时结构化失败，走重试/止损
  max_turns: 60         # agent 内部工具循环上限
  toolsets: file        # 工具白名单（file = patch/read_file/search_files/write_file）；
                        # 设为空串则不加 -t（全量工具，逃生门）
  # 会话续接（B2，默认 false）：true 时逐段写作可经 `--resume` 接上一段的子会话，
  # 而不是每段冷启动。⚠️ 这是**行为变更**（agent 上下文跨段累积），真实试写尚无
  # 收益实测证据 —— 首次启用建议先跑一章，看过产物质量与用量再决定是否长期开。
  session_continuation: false

providers:
  tokenhub:
    type: openai-compat
    base_url: https://tokenhub.tencentmaas.com/v1
    api_key_env: TOKENHUB_API_KEY
    timeout: 600
    retries: 5
    available_models:
    - qwen3.5-flash
    - minimax-m2.7
    - glm-5.1
    - glm-5-turbo
    - glm-5
    - glm-5.3
    - glm-5.3-flash
    - deepseek-v4-flash
    - deepseek-v4-pro
    - kimi-k2.6
    - kimi-k3
    fallback:
    # ⚠️ fallback 链里不得放**已下线/即将下线**的模型：`_post_chat` 对 400/401/403/404
    # 直接 raise，死模型一跳就会吃掉链上后续所有兜底（2026-10-09 glm-5 下线 → 已摘除）。
    - kimi-k2.6
    - minimax-m2.7
    - glm-5-turbo
    disable_thinking_models:
    - minimax-m2.7   # 2026-09-23 实测：默认进思考（reasoning 388 字 / 正文 54 字，输出 token 翻 3 倍）
                     # 注入 payload[0] `thinking:{type:disabled}` 有效（总输出 129→58）；
                     # ⚠️ 但 payload[1] `reasoning_effort:none` 对本模型**有害**（reasoning 1107、
                     # 正文为空、撞满 max_tokens）→ 候选顺序不能把它提到前面
    - glm-5.1
    - glm-5
    - glm-5-turbo
    - glm-5.3
    - glm-5.3-flash
    - kimi-k2.5
    - kimi-k2.6
    - kimi-k3
    - qwen3.5-flash
    disable_thinking_payloads:
    - thinking:
        type: disabled
    - reasoning_effort: none
    - enable_thinking: false
  # 美团 LongCat（龙猫）—— 2026-10-01 预置。OpenAI 兼容协议，与上面同一套客户端，
  # 代码零改动（换供应商只改本文件）。
  # ⚠️ 拿到 Key 后**必须实测**两处（官方文档自相矛盾）：
  #   ① base_url：文档给的端点是 .../openai/v1/chat/completions，SDK 示例却写
  #      base_url=.../openai。本项目的客户端按 `base_url + "/chat/completions"` 拼接，
  #      故先填带 /v1 的完整形态；**若报 404 就删掉结尾的 /v1**。
  #   ② /models 拉取：GUI「↻ 同步服务商模型」会请求 `base_url + "/models"`，
  #      龙猫若不支持该端点会返回错误 —— 属**可忽略**（另两处入口不受影响）。
  # 自检：python scripts/nfctl.py model-check longcat
  longcat:
    type: openai-compat
    base_url: https://api.longcat.chat/openai/v1
    api_key_env: LONGCAT_API_KEY
    timeout: 600
    retries: 5
    available_models:
    - LongCat-2.0            # 1M 上下文 / 最大输出 128K（官方规格）
    - LongCat-2.5-Preview
    fallback: []             # ⚠️ 刻意留空：跨供应商的模型名不能放进同一个 base_url 下
                             # （本项目 fallback 链复用当前 provider 的端点与 Key，
                             #   放 tokenhub 的模型名进来 → 404 → 直接 raise，吃掉整条链）
    # disable_thinking_models 暂不预设：LongCat-2.x 是否默认进思考模式**未实测**。
    # 若实测正文为空/进 reasoning_content，把模型名加进来即可（无需改代码）。
model:
  default:
    provider: tokenhub
    id: kimi-k2.6
  architect:
    provider: tokenhub
    id: kimi-k2.6
  outliner:
    provider: tokenhub
    id: kimi-k2.6
  writer:
    provider: tokenhub
    id: kimi-k2.6
  checker:
    provider: tokenhub
    id: kimi-k2.6
  reviewer:
    provider: tokenhub
    id: kimi-k2.6
  polisher:
    provider: tokenhub
    id: kimi-k2.6
budget:
  # ⚠️⚠️ engine: hermes 下**本键是虚设**（2026-10-03 核实）：hermes 走订阅流量，
  #   `cost_tracker.estimate_cost_yuan` 对 provider="hermes" **恒返 0** →
  #   `cost_log.cost_yuan` 全是 0 → 金额阈值永远不会命中。
  #   **止烧请用下面的 token_limit（token 级熔断）**；切回 engine: direct 时本键
  #   立即恢复生效（那时才按量计费）。
  limit_yuan: 300
  warn_ratio: 0.7
  # ==================== token 级熔断（P0 止烧，2026-10-03）====================
  # 为什么必须有：hermes 下 ¥ 记账恒 0（见上）→ 一次跑几十章的子会话可以一路烧到
  #   没边。这里按 **token** 记账并熔断，触发后**走现有 budget/pause 机制**
  #   （progress.json 的 budget.paused + 退出码 2）—— 不新增状态机、不新增暂停语义。
  # 记账口径：`cost_log` 的 tokens_in/tokens_out（真实 usage，hermes 由 result.tokens
  #   回传），累计按 **run_id** 归集 → 「一轮」= 一次 orchestrator.run()。
  #   ⚠️ 熔断后重跑（--from N）会开新 run_id → 计数归零，这是刻意的「每轮」语义。
  token_limit:
    enabled: true
    # 单请求**输出**上限（2026-10-03 用户定调：50000，按单章 5000~15000 字、
    #   常态 ~8000 字的口径留足余量 —— 它拦的是**失控生成**（复读/思考跑飞），
    #   不是正常写长章）。
    #   direct 引擎真的设进每次请求的 payload["max_tokens"]（超了 finish_reason=length
    #   → 不落盘 + 退出码 2）；hermes 引擎**没有这个旋钮**（hermes chat 不接受
    #   max_tokens）→ 只做「实测值 vs 本值」的比对与 WARN，默认不据此熔断
    #   （见 per_request_pause_hermes）。
    per_request_max_tokens: 50000
    # hermes 是否把「单次子会话输出 > per_request_max_tokens」也当熔断判据。
    #   **默认 false**：实测 hermes 一次 stage1 子会话输出就有 1.8 万 token
    #   （含工具循环内的多轮）。要看真实数据请翻日志里的 WARN，或改这里再跑。
    per_request_pause_hermes: false
    # 单轮运行**累计** token 上限（输入 + 输出）：超了即熔断暂停。
    #   2026-10-03 用户定调 1000 万/轮：给整本（多阶段 + 重试 + 精修）留足余量，
    #   「鬼知道会不会发生什么奇怪的情况」—— 阈值先放宽，真撞上说明确实异常。
    #   量级参考：hermes 一次 stage1 子会话 ≈ 11.6 万（输入 9.8 万 + 输出 1.8 万），
    #   40 章的 stage4 逐章子会话合计通常 200~400 万。
    #   熔断后：调大本值 → 清 progress.json 的 budget.paused → orchestrator --from N 续跑。
    max_total_tokens: 10000000
    warn_ratio: 0.7
    # 以上四值可在桌面端「设置 → 预算与止烧」里改（含「恢复默认预设」）；
    # 越界值会被拒绝（0/负数会让闸门静默消失，与"¥ 记账恒 0"是同一类坑）。
    # 预设取值见 scripts/utils/cost_tracker.py 的 TOKEN_LIMIT_PRESET。
  # 熔断恢复：manual = 用户通过 GUI 手动恢复（默认）
  circuit_breaker:
    mode: "manual"
    require_confirmation: true
    show_restart_from: true
parallelism:
  writing: 1
  polish: 3
  checks_max_concurrent: 2
chapter:
  # 单章字数区间（提示词按它约束篇幅）。**总量用章数控制，不要靠抬高这里**：
  # 要 ≥20 万字就写 ≥40 章（40 × ~5000）。2026-10-02 曾把它抬到 [8000,12000]，
  # 结果一批端到端用例因夹具按"目标下限"生成长章而假红 —— 已撤回，
  # 夹具的循环复用问题在 utils/fake_client._words_para 里另修。
  # 确需单章 8000+ 也可以改（夹具已加固），但先确认这是你要的篇幅口径。
  target_words:
  - 2000
  - 5500
  summary_every: 15
  summary_window: 15
  batch_outline: 10
  quality_threshold: 6
  page_break: true
gates:
  agent_mode: true                 # 外部 Agent 模式：开启后 HTTP API 开放给外部 Agent 调用，
                                   # 但禁止性操作（审批/打回/归档/恢复/项目创建）仍只允许 GUI 内手动执行
  require_approval:
  - 2
  - 6
  pause_on_failure: true
  setting_refine_reminder: true
  setting_refine_auto: false     # stage1 后自动跑 setting_refine --auto-thin 闭环（默认关）
  # 素材库陪跑 / 自主（B4）。**只有显式写下这个键才生效**（键缺失 = 保持改动前行为，
  # 老配置与测试替身不受影响）：
  #   false（本机默认，**陪跑**）= stage1 归并结束后**停在审批门**，等作者看冲突清单并拍板
  #     （GET /setting/conflicts → nf_set_material_status 或 material_review.py --reject
  #      → approve.py --stage 1）。人在场时更安全，也是默认值。
  #   true（**自主**）= 不额外停，仍按 require_approval 走。
  material_autonomy: false
  setting_refine_max_rounds: 1   # 闭环轮次上限（1=只跑一轮；建议不超过 2）
  review_after_stage4: true
  review_after_stage5: false
  proofread_after_polish: false  # stage 5.5：润色后校对（默认关）
  proofread_llm: false           # 校对是否启用 LLM 语义校对（默认关）
  auto_refine: false
  auto_rewrite: false
  auto_rewrite_max_rounds: 1
  # 长跑保护（2026-10-01）：stage4 逐章写作中**连续 N 章失败**即判定为系统性故障
  # （模型不可用 / 提示词被改坏 / 输入构造出错）并**提前停止**，避免"坏掉了还一路
  # 跑完 100 章"在盘上留下满盘废稿。0 = 关闭本保护。
  stage4_max_consecutive_failures: 3
  auto_retry: true                # 阶段失败后自动重试（默认开）
  auto_retry_max_rounds: 2        # 最大自动重试轮次（不含首次）
  auto_retry_delay_seconds: 3      # 重试前等待（秒），给 LLM 限流/超时恢复时间
  auto_retry_backoff: 2            # 退避系数：3s → 6s → 12s …
  quality_gate: true               # 件4：全流程收尾强制跑 quality_checklist，非零退出即红阻断
                                   # （防「门禁失守还盖绿灯」：产物存在 ≠ 产物合格）。
                                   # 仅在**全流程**收尾生效；单阶段 --stage N 重跑不拦。
  stage8_export: true  # 阶段8：Markdown 分卷导出
obsidian:
  # vault path（只读）：用户自己的 Obsidian 知识库根目录
  # 留空则不启用 Obsidian 联动；首次使用请在 GUI「设置」页填写本地路径
  # （本地私有路径不应进 Git——请在本地覆盖，切勿提交自己的真实路径）
  vault_path: ""
  # Obsidian 联动沙盒目录（唯一可写位置，vault 本体只读）
  # 支持绝对路径或相对路径（相对于项目根目录）
  sandbox_dir: ""
  # 是否启用路径遍历防护（默认开）
  path_traversal_guard: true
  # ---- vault 目录映射（A1：可配置；默认值=通用虚构布局，仅开箱演示）----
  # 每人 Obsidian 布局不同：把你的真实结构填进 config/system.local.yaml
  # （不进 Git）的同名键即可整体覆盖，例如：
  #   obsidian:
  #     vault_dirs:
  #       characters: "我的设定/我的人物"
  #       ...
  # 目录落空时扫描会打告警（不静默扫零）；characters 建议「根/目录」两段式。
  vault_dirs:
    characters: "设定/人物"    # 角色卡（其下子目录按类目归档）
    locations:   "设定/地点"   # 世界观-地点
    factions:    "设定/势力"   # 世界观-势力
    concepts:    "设定/概念"   # 世界观-概念
    timeline:    "年表"        # 时间线
  # ---- 跳过目录（非正典内容）----
  # 语义 = **追加**（2026-10-02 修正）：默认四项恒生效，本键只写你要**额外**跳过的
  # 目录（如数字前缀模板目录、其他项目目录）。想追加却写成整份清单 → 默认项会被
  # 顶掉（旧实现就是这样，已改掉）。
  # 例：在 system.local.yaml 写
  #   obsidian:
  #     skip_dirs: ['模板归档']
  skip_dirs: ['.obsidian', '.git', '.hermes', '.agent_context']
  # ---- 旧布局兼容锚点（可选，默认空）----
  # `path_kind` 判据靠 `vault_dirs.characters` 的「根/目录」两段式锚点。
  # **换了锚点又不填这里，你既有的 vault 数据会整体失去 path 判据**（静默退回
  # name 词表）。历史布局请把你自己的结构在 system.local.yaml 里追加，例如：
  #   obsidian:
  #     extra_character_anchors: ["我的旧布局/人物"]
  # 多锚点并存，命中哪个根就按哪个根比；代码里不写任何具体目录名。
  extra_character_anchors: []
logging:
  level: info
  rotate_days: 30
