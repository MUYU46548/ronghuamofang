# =========================================================
# NovelForge 项目信息（每次运行前可修改）
# 参考：架构文档 v2 4.2 / 十一
# =========================================================

book:
  name: "留下你的歌"        # 书名
  genre: "奇幻、科幻"                    # 类型
  target_words: 80000            # 全书目标字数
  style: "奇幻日常、白描勾画"           # 风格（如：偏治愈日常、史诗群像）
  chapters: 12                    # 本次运行章节数
  language: "zh-CN"
  author: ""            # 作者名（用于 Word 模板 [作者] 占位符，可留空）
  # 用户提供的大纲/梗概/核心构思（可选）。留空则系统基于素材自拟。
  # 多行写法：user_outline: |
  #   第一句点明核心设定……
  #   第二句点明主角弧光……
  user_outline: ""
  # Word 成品模板（可选）。放 templates/ 下（.dotx 或 .docx），stage7 以模板为底版：
  #   替换 [书籍标题]/[作者] 占位符、[目录占位符] 插入 TOC 域、正文写入 [请输入文本] 之后。
  #   更换模板 = 替换本字段路径或覆盖 templates/ 下文件，无需改代码。
  word_template: "templates/小说格式模板V1.3.dotx"
  # 风格参考文本（可选，写作阶段注入）。放 materials/ 下（如 materials/style_sample.md），
  #   1-2 篇你满意的范文/片段，stage4 写作时模仿其节奏、用词与句式。留空则按模板文风要求。
  #   配置了它，系统还会自动从范文中抽取代表性原文片段作为 few-shot 示例（自动避开与
  #   当前章节内容高度相似的段落，并标注来源位置）。
  style_reference: ""
  # 用户风格笔记（可选）。手动补充的风格要求，与上方自动分析结论叠加注入 stage4/stage6。
  #   当两者冲突时以本节为准。留空则完全不注入，不影响现有逻辑。
  #   多行写法：style_notes: |
  #     多用短句，少用形容词
  #     对话要带方言味，避免书面腔
  #   控制台「设置」页签可直接编辑本字段（经 IPC 写入，保存前自动备份 config/history/）。
  style_notes: ""

materials:
  # 结构化素材卡目录（管线消费）：stage1 扫描此处并归并成设定集
  dir: "materials/raw"
  # 原始创作碎片目录（用户自由命名、私人数据、不进 Git）：
  #   自由命名、格式随意，只作 stage1 归并的额外输入，永不写进 materials/raw/
  #   聚类/时间轴/前瞻备忘由 scripts/utils/scrap_cluster.py 确定性生成
  #   （聚类靠内容共现，不依赖文件名；改碎片会触发设定集重新归并）
  scraps_dir: "materials/original_scraps"
  # 是否启用碎片管线：true=自动（碎片为空时自动退化为普通流程）；false=完全忽略碎片
  use_scraps: true

vault:
  readonly: true                  # Obsidian 设定库只读（系统永不写入 vault）
  vault_links: "materials/vault_links.md"  # 设定库引用索引（阶段1 生成/维护）

run:
  output_word: true               # 阶段7 是否转 Word（false 则仅输出 merged Markdown）
