# =========================================================
# NovelForge → Obsidian 后处理配置（P1.6）
# 修改此处路径即可适配不同知识库/模板版本，无需改代码
# =========================================================

obsidian_templates:
  # 输出沙盒目录（Obsidian 只读红线：只写这里，不写库本体）
  # 留空则回落到 data/state/obsidian_sandbox/（项目内，开箱可用）
  sandbox_dir: ""
  # 官方模板（仅用于读取结构参考；实际草稿由提示词模板按此结构生成）
  # 留空则跳过模板参考
  book_template: ""
  role_template: ""
  # Obsidian 角色词条目录（用于判定"已有词条"→只出出场记录；无词条→出设定草稿）
  # 留空则全部角色都出设定草稿
  character_dirs: []
