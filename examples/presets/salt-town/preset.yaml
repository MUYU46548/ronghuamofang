# =========================================================
# 出厂预设 · 盐镇旧事（现实乡土 / 二十年时间跨度）
# 用法：python scripts/preset_apply.py --apply salt-town
# 验什么：跨 20 年时间线不串、人物年龄关系可推演
# =========================================================
id: salt-town
name: "盐镇旧事"
genre: "现实"
chapters: 10
hidden: false

summary: |
  1998 年盐场改制，陈守田把工龄买断的钱借给了工头老周。二十年后老周的儿子回来，
  带着一张当年的借条，和一个陈守田从没听说过的数字。

capabilities:
  - "时间线：1998 / 2008 / 2018 三层，每章开头必须让读者知道自己在哪一年"
  - "年龄与关系可推演：人物年龄随年份变化，不能出现二十年后外貌不变的写法"
  - "现实题材不煽情：不许用苦难抒情替代事件推进"
  - "物证链：借条、盐票、工区花名册三件物证跨章传递，不得凭空出现或消失"

user_outline: |
  1998 年，盐场三工区改制，陈守田四十二岁，买断工龄拿到八千四百块。
  工头老周说儿子要交学费，借走六千，没打借条，只在盐票背面写了个数字。
  2008 年，陈守田的女儿陈招娣考上师范，他去镇上找老周要钱，老周已经中风，
  周家搬去了县城，只留下一间锁着的宿舍。陈守田没再提这笔钱。
  2018 年，老周的儿子周回来到盐镇，带着一张借条，上面写着六万。
  陈守田认出那不是自己的字。两人去查工区花名册，发现 1998 年那次改制的
  买断名单上，老周自己的名字被划掉了——他从来没买断，那六千是公款。
  最后一章，陈守田把盐票还给周回，说这笔账不该由他还。周回把借条烧了，
  留在盐镇做了盐场遗址的看护人。

verify:
  min_cards: 7
  min_chapter_words: 5000
  must_mention: ["陈守田", "老周", "陈招娣", "盐场三工区", "供销社", "盐票"]
  forbidden: ["雾港", "沈砚", "炭城", "禾芷", "潮下城", "青石站", "灵力"]
