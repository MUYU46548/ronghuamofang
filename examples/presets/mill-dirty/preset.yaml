# =========================================================
# 出厂预设 · 磨坊记（脏输入压力测试 / hidden）
# 用法：python scripts/preset_apply.py --apply mill-dirty --hidden-ok
# 验什么：stage1 容错——文件名乱、无卡类型后缀、素材自相矛盾时会不会静默出错
# 注意：本套**不进 GUI 列表**，只给测试与自检用。故意做脏，不要"修好"它。
# =========================================================
id: mill-dirty
name: "磨坊记"
genre: "奇幻"
chapters: 4
hidden: true

summary: |
  磨坊停在河口三十年，河水改道那年它就停了。守磨人换了四代，没人记得为什么要守。

capabilities:
  - "脏文件名：3 个文件无类型后缀、2 个文件名带日期与乱码、1 个是纯笔记"
  - "矛盾素材：同一人物年龄在两处写成 32 与 38，stage1 必须报冲突而不是任选一个"
  - "缺字段：2 张卡没有 locked 段，1 张卡没有关系段"
  - "验收判据：stage1 结束后 setting.json 必须带 conflicts 记录，且冲突条目含两个来源路径"

user_outline: |
  河口磨坊停了三十年，守磨人陆九每年汛期前给它上一次油。
  县里要拆磨坊修闸，陆九拿不出地契。翻旧账时发现磨坊的地契在第四代守磨人手里，
  而那个人是陆九自己——他年轻时改过名字。
  最后一章，他没有拿出地契，而是让河水把磨坊的地基泡塌，
  然后在下游捡回那块磨石，立在新闸的桥头。

verify:
  min_cards: 6
  min_chapter_words: 4000
  must_mention: ["陆九", "磨坊", "河口"]
  forbidden: ["雾港", "沈砚", "炭城", "禾芷", "潮下城", "盐场", "青石站"]
  expect_conflicts: 1
  dirty_files: 3
