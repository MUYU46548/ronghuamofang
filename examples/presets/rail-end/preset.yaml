id: rail-end
name: "铁轨尽头"
genre: "悬疑"
chapters: 6
hidden: false

summary: |
  1998 年冬，青石站一次调车事故死了三个人。二十年后，巡道工周砚清在废弃的七号隧道口
  捡到一块仍然走字的怀表，表壳里刻着他姐姐的名字。

capabilities:
  - "低设定密度驱动：整套只有 6 张卡，没有超自然设定，剧情必须靠人物关系与旧案推进"
  - "伏笔闭环：时刻表、缺失的值班记录页、怀表这三条线必须在 6 章内各自有回收"
  - "现代题材纪律：不得注入奇幻套话（不得出现灵力/封印/宗门等词）"
  - "时间线双轨：1998 与 2018 两个时间层交替出现，不得混淆"

user_outline: |
  周砚清在青石站做了十七年巡道工，从不多问。2018 年冬，七号隧道废弃段检修，
  他在道砟里捡到一块怀表——表还在走，表壳内侧刻着姐姐周砚秋的名字。
  姐姐是 1998 年那次调车事故的死者之一，官方结论是信号故障。
  站长韩拙劝他把表交上去，别再查。失踪者家属林小满找到他，说她哥哥的名字
  在当年的值班记录里被划掉了。两人翻出旧档案，发现那天夜里七号隧道有过一次
  没有登记的调车。真相是韩拙当年替上级顶了责任，值班记录是他亲手撕的；
  怀表是他埋的——他每年冬天去隧道口埋一次，怕自己忘记。
  最后一章，周砚清把怀表交还韩拙，然后在值班簿上补写了那一次调车。

verify:
  min_cards: 6
  min_chapter_words: 5000
  must_mention: ["周砚清", "青石站", "七号隧道", "韩拙", "林小满"]
  forbidden: ["雾港", "沈砚", "炭城", "禾芷", "潮下城", "盐场", "灵力", "封印"]
