# =========================================================
id: tidal-archive
name: "潮汐档案"
genre: "科幻"
chapters: 8
hidden: false

summary: |
  潮下城每隔十二年沉没一次，档案馆员沈澜负责在沉没前把该留下的留下、该销毁的销毁。
  这一次，她在待销毁清单里看见了自己的名字。

capabilities:
  - "多 POV：四个视角各有独立的用词与关注点，切换必须靠场景与信息差，不靠标题提示"
  - "locked 规则守持：潮汐历、溺声症两条物理规则不可违逆（设定卡已标 locked）"
  - "群像不串味：四个主角不得共享同一套内心独白句式"
  - "信息不对称：每个视角只知道自己的那一部分，全知视角严禁出现"

user_outline: |
  潮下城建于环礁井之上，每十二年一次大潮，全城下潜避潮，靠潮汐历计时。
  沈澜是档案馆员，负责在每次下潜前筛选档案：留下的封存，销毁的投井。
  这一次的待销毁清单里出现了她自己的名字，编号是她入职那天的编号。
  潜航员阿澈在环礁井底发现一批没有登记的档案箱，箱里是历次"被销毁"的人。
  调解人木野受雇于城政厅，任务是让三方在下次下潜前达成一份不追责的协议。
  AI 人格白釉是档案馆的系统，它记得所有被销毁的编号，但被限制不能说。
  四个人各自推进到同一件事：下一次下潜时，哪些人会被留下。
  最终沈澜选择把自己的编号从清单上划掉，把历次销毁记录公开，
  代价是档案馆在这一次下潜中被永久封存——包括她自己。

verify:
  min_cards: 7
  min_chapter_words: 5000
  must_mention: ["沈澜", "阿澈", "木野", "白釉", "潮下城", "环礁井", "潮汐历"]
  forbidden: ["雾港", "沈砚", "炭城", "禾芷", "青石站", "盐场"]
