# =========================================================
# 出厂预设 · 第七封回信（书信体悬疑 / 文体约束）
# 用法：python scripts/preset_apply.py --apply seventh-letter
# 验什么：文体纪律能否守住（每章一封信 + 一段第三人称）
# =========================================================
id: seventh-letter
name: "第七封回信"
genre: "悬疑"
chapters: 5
hidden: false

summary: |
  临江邮局的死信箱里躺着六封信，收信人都是同一个人，寄信人栏都空着。
  第七封信是苏晚自己写的——她不记得自己写过。

capabilities:
  - "文体约束：每章必须是【一封信 + 一段第三人称场景】，两部分的语体必须可区分"
  - "格式纪律：信必须有日期、称呼、署名（署名可空缺但要留位置），不得写成日记"
  - "结构规则 locked：全书只有七封信，第七封必须是苏晚的笔迹"
  - "悬疑不靠旁白：不得用叙述者直接揭示真相，只能通过信件内容差异推进"

user_outline: |
  苏晚在临江邮局做分拣员，负责处理死信箱——寄不出去也退不回来的信。
  六封信，收信人都是"苏晚"，寄信人栏空着，邮戳从 1997 年到 2017 年，每隔四年一封。
  每封信只写一件事：一个她从未告诉过任何人的细节。
  她开始回信，把回信也投进死信箱。第七封回信到了，是她的笔迹，
  日期是 2021 年——她还没写过的未来。
  陈姨是邮局的老职工，她告诉苏晚：1997 年有个女人在这里寄过七封信，
  托她每隔四年投一封。那个女人是苏晚的母亲，1997 年离开临江时苏晚三岁。
  最后一章，苏晚拆开第七封信，里面只有一句话和一把钥匙。
  她没有去找那把钥匙开的东西，而是把七封信一起归档，编号，封存。

verify:
  min_cards: 6
  min_chapter_words: 4000
  must_mention: ["苏晚", "临江邮局", "死信箱", "陈姨", "顾行舟"]
  forbidden: ["雾港", "沈砚", "炭城", "禾芷", "潮下城", "盐场", "青石站"]
